name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax
        run: python -m py_compile steam-chat-badge tests/test_steam_chat_badge.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check --help
        run: python steam-chat-badge --help

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell scripts
        run: shellcheck install.sh uninstall.sh
